tos:
  title: "Terms of Service"
  updated: "Last updated: {date}"
  lead: "Please read the following terms in full before registering. Continuing to register means you understand and accept all of them."
  s1Title: "1. Nature of the site"
  s1Body: "This site is developed by Zes M Young and operated by: {operator}. Level data used here comes from the Rolling Sky Wiki; the rights to that content belong to its original authors and community. This is a non-commercial hobby project and has no affiliation, authorization or partnership with Rolling Sky's official parties."
  s2Title: "2. Intended use"
  s2Body: "This site exists for small rooms among friends to play light interactive games. It is designed for small-scale use and is not, and should not be used as, a public chat platform or social network. Please use it only within a trusted circle of invited people."
  s3Title: "3. Prohibited content"
  s3Body: "You must not post content that violates applicable laws, including but not limited to politically sensitive topics, religious or ethnic hostility, violence and terrorism, pornography or adult content, gambling, fraud, or content infringing on others' privacy or intellectual property. Such content is removed immediately, and offending accounts are banned and may be reported to the authorities."
  s4Title: "4. Cookies and data retention"
  s4Body: "This site uses cookies to keep you signed in, which is necessary to provide the service. Chat messages are stored on the server for seven days and then automatically deleted. Upon a lawful request, or to assist an investigation into illegal activity, relevant records may be provided to public security authorities and other competent bodies. Do not post anything you would not want retained."
  s5Title: "5. Disclaimer"
  s5Body: "The site is provided \"as is\", without any express or implied warranty of continuity, completeness or fitness for a particular purpose. Neither the developer nor the operator is liable for any direct or indirect loss arising from the use of, or inability to use, this site."
  agree: "I have read and agree to the terms above"
  view: "View terms of service"
  required: "Please read and accept the terms first"

