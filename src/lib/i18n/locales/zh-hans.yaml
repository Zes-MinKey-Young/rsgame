  s1Title: "一、站点性质与主体"
  s1Body: "本站由 Zes M Young 开发，运营主体为：{operator}。本站所使用的关卡数据来源于「滚动的天空」Wiki，相关内容版权归原作者及社区所有。本站为爱好者自发的非商业项目，与「滚动的天空」官方及其关联方没有任何隶属、授权或合作关系。"
  s2Title: "二、用途限定"
  s2Body: "本站主要用于熟识的朋友之间开设小型房间、进行轻量的互动小游戏，面向小规模场景设计，不构成、也不应被用作公共聊天平台或社交场所。请仅在获得邀请的、彼此信任的小范围内使用本站。"
  s3Title: "三、内容规范"
  s3Body: "严禁在本站发布任何违反所在地法律法规的内容，包括但不限于涉及政治敏感议题、宗教与民族对立、暴力与恐怖主义、色情与成人内容、赌博、诈骗、侵犯他人隐私或知识产权的内容。违规内容将被立即删除，违规账号将被封禁并视情况移交有关部门。"
  s4Title: "四、Cookie 与数据保留"
  s4Body: "本站使用 Cookie 维持登录状态，这是提供服务所必需的。聊天记录会在服务器上保存七日，并在到期后自动清除。在收到合法请求、或为配合调查违法违规行为时，本站可能将相关记录提供给公安机关等有权机关审查。请勿在聊天中留下你不希望被留存的信息。"
  s5Title: "五、免责声明"
  s5Body: "本站按「现状」提供，不对服务的连续性、完整性或适用性作出任何明示或默示的保证。因使用或无法使用本站而产生的任何直接或间接损失，开发主体与运营主体均不承担责任。"
