tos:
  title: "服務條款"
  updated: "最後更新：{date}"
  lead: "在註冊並進入本站前，請完整閱讀以下條款。繼續註冊即表示你已理解並同意全部內容。"
  s1Title: "一、站點性質與主體"
  s1Body: "本站由 Zes M Young 開發，營運主體為：{operator}。本站所使用的關卡資料來源於「滾動的天空」Wiki，相關內容著作權歸原作者及社群所有。本站為愛好者自發的非商業專案，與「滾動的天空」官方及其關聯方沒有任何隸屬、授權或合作關係。"
  s2Title: "二、用途限定"
  s2Body: "本站主要用於熟識的朋友之間開設小型房間、進行輕量的互動小遊戲，面向小規模場景設計，不構成、也不應被用作公共聊天平台或社交場所。請僅在獲得邀請的、彼此信任的小範圍內使用本站。"
  s3Title: "三、內容規範"
  s3Body: "嚴禁在本站發布任何違反所在地法律法規的內容，包括但不限於涉及政治敏感議題、宗教與民族對立、暴力與恐怖主義、色情與成人內容、賭博、詐騙、侵害他人隱私或智慧財產權的內容。違規內容將被立即刪除，違規帳號將被封禁並視情況移交有關部門。"
  s4Title: "四、Cookie 與資料保留"
  s4Body: "本站使用 Cookie 維持登入狀態，這是提供服務所必需的。聊天記錄會在伺服器上保存七日，並在到期後自動清除。在收到合法請求、或為配合調查違法違規行為時，本站可能將相關記錄提供給公安機關等有權機關審查。請勿在聊天中留下你不希望被留存的資訊。"
  s5Title: "五、免責聲明"
  s5Body: "本站按「現狀」提供，不對服務的連續性、完整性或適用性作出任何明示或默示的保證。因使用或無法使用本站而產生的任何直接或間接損失，開發主體與營運主體均不承擔責任。"
